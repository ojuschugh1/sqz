[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqz"
version = "2.0.0"
description = "Pre-injection context compression and session deduplication for AI coding agents: squeeze tool output, code, JSON and logs before they reach the LLM"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.8"
keywords = ["llm", "context-compression", "token-optimization", "context-window", "coding-agents", "ai-agents", "mcp", "mcp-server", "claude-code", "cursor", "codex", "compression", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ojuschugh1/sqz"
Repository = "https://github.com/ojuschugh1/sqz"

[project.scripts]
sqz = "sqz.__main__:main"
sqz-mcp = "sqz.__main__:main_mcp"

[tool.setuptools.packages.find]
where = ["python"]
