[package]
name = "sqz-engine"
version = "1.9.0"
edition = "2021"
description = "Context compression engine behind sqz: per-command formatters, SHA-256 session dedup, AST structural summaries, token counting and budget tracking for AI coding agents"
license-file = "../LICENSE"
repository = "https://github.com/ojuschugh1/sqz"
homepage = "https://github.com/ojuschugh1/sqz"
keywords = ["llm", "compression", "context-compression", "token-optimization", "coding-agents"]
categories = ["text-processing", "development-tools"]
readme = "../README.md"
exclude = ["proptest-regressions/"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
toml = { workspace = true }
# toml_edit is already in the tree via toml 0.8. Pull it in directly so
# we can round-trip a user's ~/.codex/config.toml while preserving their
# comments and key order — plain `toml` loses both on re-serialize.
toml_edit = "0.22"
sha2 = { workspace = true }
chrono = { workspace = true }
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-bash = "0.21"
notify = "6"
tempfile = "3"
tiktoken-rs = "0.6"
dirs-next = "2.0"

[dev-dependencies]
proptest = { workspace = true }
