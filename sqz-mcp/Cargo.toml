[package]
name = "sqz-mcp"
version = "1.6.1"
edition = "2021"
description = "MCP server and proxy for sqz: compress tool results, file reads and other MCP servers' output before it enters the LLM context (stdio/SSE)"
license-file = "../LICENSE"
repository = "https://github.com/ojuschugh1/sqz"
homepage = "https://github.com/ojuschugh1/sqz"
keywords = ["mcp", "mcp-server", "llm", "coding-agents", "context-compression"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
readme = "../README.md"

[[bin]]
name = "sqz-mcp"
path = "src/main.rs"

[lib]
name = "sqz_mcp"
path = "src/lib.rs"

[dependencies]
sqz-engine = { path = "../sqz_engine", version = "1.6.1" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
notify = "6"
# regex: needed by sqz_grep MCP tool (issue #12). Using default features
# keeps binary size reasonable (~800KB added) while providing Unicode
# support — agents grep source code with accents/unicode more often
# than you'd think.
regex = "1"

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"
