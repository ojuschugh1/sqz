[package]
name = "sqz-cli"
version = "1.7.0"
edition = "2021"
description = "Pre-injection context compression and session deduplication for AI coding agents: squeeze tool output, code, JSON and logs before they reach the LLM"
license-file = "../LICENSE"
repository = "https://github.com/ojuschugh1/sqz"
homepage = "https://github.com/ojuschugh1/sqz"
keywords = ["llm", "mcp", "claude-code", "coding-agents", "context-compression"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
readme = "../README.md"
include = ["src/**/*", "completions/*", "../LICENSE", "../README.md"]

[[bin]]
name = "sqz"
path = "src/main.rs"

[dependencies]
sqz-engine = { path = "../sqz_engine", version = "1.7.0" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
clap = { version = "4", features = ["derive"] }
chrono = { workspace = true }
libc = "0.2"
rusqlite = { workspace = true }
dirs-next = "2.0"

[dev-dependencies]
proptest = { workspace = true }
tempfile = "3"
